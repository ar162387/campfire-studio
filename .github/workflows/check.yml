name: Check studio
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check software WebGL and native export
        env:
          CAMPFIRE_BROWSER_DEBUG: '1'
        run: |
          npm run doctor -- --software
          npm run render -- examples/starter.episode.json --software --silent --talk-preview --seconds .2 --output output/ci-silent.mp4
          npm run render -- examples/starter.episode.json --software --silent --talk-preview --seconds .2 --output output/ci-silent.mp4
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('output/ci-silent.mp4.json')); if(r.reusedFrames!==6 || r.renderedFrames!==0) throw Error('Resume failed');"
      - name: Render registered scenes and states
        run: npm run gallery -- output/ci-gallery --software
      - name: Prepare voice request without provider credits
        run: python3 tools/voice-scene.py prepare examples/one-tiny-change.episode.json --model eleven_v4 --pronunciations examples/pronunciations.json --out output/ci-voices
